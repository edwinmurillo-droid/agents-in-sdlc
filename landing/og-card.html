<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>Tab Commander share image</title>
<link rel="stylesheet" href="styles.css" />
<style>
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #101218;
  }
  .card {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 72px 76px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background:
      radial-gradient(700px 420px at 100% 0%, rgba(91, 140, 255, 0.28), transparent 60%),
      #101218;
    color: #f4f1ea;
  }
  .card .eyebrow { margin: 0; }
  .card h1 {
    font-size: 84px;
    line-height: 0.96;
    max-width: 920px;
    margin: 18px 0 0;
  }
  .card .sub {
    margin-top: 22px;
    font-size: 28px;
    color: #c9c6bd;
    max-width: 760px;
  }
  .card footer {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #e7c36a;
  }
</style>
</head>
<body>
  <div class="card">
    <div>
      <p class="eyebrow">Tab Commander · Chrome extension</p>
      <h1>Every open tab. One live dashboard.</h1>
      <p class="sub">Search, select, or speak. Free on the Chrome Web Store. Version 1.0.0.</p>
    </div>
    <footer>
      <span>Free · Manifest V3</span>
      <span>ALL IN 1 SALES DISTRIBUTION &amp; MORE LLC</span>
    </footer>
  </div>
</body>
</html>
